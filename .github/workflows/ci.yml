name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lua: "5.4"
          - os: ubuntu-latest
            lua: luajit-2.1
          - os: windows-latest
            lua: "5.4"
          - os: macos-latest
            lua: "5.4"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOOME_BACKEND: test
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@v6
        if: runner.os != 'Windows'
      - name: luarocks on windows
        if: runner.os == 'Windows'
        run: |
          curl -fsSLo "$RUNNER_TEMP/lr.zip" https://luarocks.github.io/luarocks/releases/luarocks-3.13.0-windows-64.zip
          unzip -q "$RUNNER_TEMP/lr.zip" -d "$RUNNER_TEMP"
          cp "$RUNNER_TEMP"/luarocks-3.13.0-windows-64/luarocks.exe .lua/bin/
          luarocks config lua_dir "$(cygpath -w "$PWD/.lua")"
          echo "LUA_PATH=$(luarocks path --lr-path | tr -d '\r');;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(luarocks path --lr-cpath | tr -d '\r');;" >> "$GITHUB_ENV"
      - name: install
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="$(dirname "$(command -v cl)"):$PATH"; fi
          luarocks install goome-*.rockspec
      - name: run on the test backend
        run: |
          mkdir -p shots
          out=$(GOOME_TEST_SHOTS=shots GOOME_TEST_SCRIPT="screen 1280x720 1; 3 click 60,28; end 6" lua main.lua)
          echo "$out"
          ls shots | grep -q ppm
          if [ -d variants ]; then echo "$out" | grep -q "overlay mode"; fi
      - name: other templates
        if: hashFiles('variants/**') != ''
        run: |
          for v in variants/*/; do
            n=$(basename "$v")
            mkdir -p "shots-$n"
            GOOME_TEST_SHOTS="shots-$n" GOOME_TEST_SCRIPT="screen 1280x720 1; 2 hotkey alt+m; 3 click 100,140; end 6" lua "$v/main.lua"
            ls "shots-$n" | grep -q ppm
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}-${{ matrix.lua }}
          path: shots*/
          if-no-files-found: ignore
